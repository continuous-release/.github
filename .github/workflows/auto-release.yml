name: auto-release

# Reusable release contract for every repo in the continuous-release org.
#
# Triggered by a push to main in the caller. It computes the next version from
# conventional commits since the last v* tag, builds and tests, publishes if a
# publish command is supplied, then creates (or updates) a GitHub Release with
# the version tag and artifacts.
#
# The version is never committed back to main. Tags are the source of truth,
# which keeps this from triggering itself.

on:
  workflow_call:
    inputs:
      system:
        description: Build-system adapter (nx, bazel, nix, buck2)
        required: true
        type: string
      setup-command:
        description: Optional shell command run before tests (dependency install)
        required: false
        type: string
        default: ''
      test-command:
        description: Optional shell command run before the build
        required: false
        type: string
        default: ''
      build-command:
        description: Shell command that produces the release artifacts
        required: true
        type: string
      publish-command:
        description: Optional shell command run after a successful build
        required: false
        type: string
        default: ''
      artifact-glob:
        description: Glob of files to attach to the GitHub Release
        required: false
        type: string
        default: ''
      artifact-name:
        description: Name of the intermediate artifact
        required: false
        type: string
        default: release-artifacts
      runs-on:
        description: Runner label
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  version:
    name: version
    runs-on: ${{ inputs.runs-on }}
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      existing: ${{ steps.next.outputs.existing }}
      previous_tag: ${{ steps.next.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: continuous-release/.github
          ref: main
          path: .harness
          persist-credentials: false
      - name: Compute next version
        id: next
        run: node .harness/scripts/next-version.mjs

  build:
    name: build
    needs: [version]
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Nx
        if: inputs.system == 'nx'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Setup Bazel
        if: inputs.system == 'bazel'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-amd64
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Setup Nix
        if: inputs.system == 'nix'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Buck2
        if: inputs.system == 'buck2'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/buck2.zst" \
            https://github.com/facebook/buck2/releases/download/2026-10-15/buck2-x86_64-unknown-linux-musl.zst
          zstd -d "$RUNNER_TEMP/buck2.zst" -o "$RUNNER_TEMP/buck2"
          chmod +x "$RUNNER_TEMP/buck2"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Setup
        if: inputs.setup-command != ''
        run: ${{ inputs.setup-command }}
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Build
        run: ${{ inputs.build-command }}
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Configure npm auth
        if: inputs.system == 'nx' && inputs.publish-command != ''
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            '@continuous-release:registry=https://npm.pkg.github.com' \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            > "$HOME/.npmrc"

      - name: Publish
        if: inputs.publish-command != '' && needs.version.outputs.existing != 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: ${{ inputs.publish-command }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.artifact-glob != ''
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-glob }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [version, build]
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: continuous-release/.github
          ref: main
          path: .harness
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.artifact-glob != ''
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - name: Generate notes
        env:
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: node .harness/scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          assets=()
          if [ -d dist ]; then
            while IFS= read -r -d '' file; do
              assets+=("$file")
            done < <(find dist -type f -print0)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            if [ "${#assets[@]}" -gt 0 ]; then
              gh release upload "$TAG" "${assets[@]}" --clobber
            fi
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${assets[@]}"
          fi
