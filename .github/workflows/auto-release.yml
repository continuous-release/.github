name: auto-release

# Reusable continuous-release contract for the continuous-release org.
#
# A push to main derives the next version from conventional commits since the
# last v* tag, builds and tests, optionally publishes, then creates or updates a
# GitHub Release with the tag and artifacts. Tags are the source of truth; the
# workflow never commits a version bump back to main, so it cannot trigger
# itself. Re-running the same commit updates the existing release instead of
# creating a new version.
#
# The versioning, notes, and release logic lives in
# continuous-release/toolkit. This workflow only supplies the build-system
# setup and runs the caller's commands.

on:
  workflow_call:
    inputs:
      system:
        description: Build-system adapter (node, nx, bazel, nix, buck2, none)
        required: true
        type: string
      toolkit-ref:
        description: continuous-release/toolkit ref to run
        required: false
        type: string
        default: v0.3.0
      working-directory:
        description: Directory containing the project
        required: false
        type: string
        default: .
      setup-command:
        description: Optional shell command run before tests (dependency install)
        required: false
        type: string
        default: ''
      test-command:
        description: Optional shell command run before the build
        required: false
        type: string
        default: ''
      build-command:
        description: Shell command that produces the release artifacts
        required: true
        type: string
      publish-command:
        description: Optional shell command run after a successful build
        required: false
        type: string
        default: ''
      artifact-glob:
        description: Glob of files to attach to the GitHub Release
        required: false
        type: string
        default: ''
      runs-on:
        description: Runner label
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install the release toolkit
        env:
          TOOLKIT_REF: ${{ inputs.toolkit-ref }}
        run: |
          set -euo pipefail

          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset="cr-linux-x86_64" ;;
            *)
              echo "No prebuilt cr binary for $(uname -s)-$(uname -m)" >&2
              exit 1
              ;;
          esac

          curl -fsSL -o "$RUNNER_TEMP/cr" \
            "https://github.com/continuous-release/toolkit/releases/download/${TOOLKIT_REF}/${asset}"
          chmod +x "$RUNNER_TEMP/cr"
          "$RUNNER_TEMP/cr" --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.system == 'node' || inputs.system == 'nx'
        with:
          node-version: '22'

      - name: Setup Nx
        if: inputs.system == 'nx'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Setup Bazel
        if: inputs.system == 'bazel'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-amd64
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Setup Nix
        if: inputs.system == 'nix'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Buck2
        if: inputs.system == 'buck2'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/buck2.zst" \
            https://github.com/facebook/buck2/releases/download/2026-10-15/buck2-x86_64-unknown-linux-musl.zst
          zstd -d "$RUNNER_TEMP/buck2.zst" -o "$RUNNER_TEMP/buck2"
          chmod +x "$RUNNER_TEMP/buck2"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The tag is the version lock. Reserving it before build and publish
      # means a re-run continues the same release instead of bumping again,
      # and a concurrent run either re-plans from the winning tag or reports
      # that it was superseded by a later release.
      - name: Reserve
        id: plan
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cr reserve --notes-out "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA"

      - name: Setup
        if: inputs.setup-command != '' && steps.plan.outputs.superseded != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.setup-command }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}

      - name: Test
        if: inputs.test-command != '' && steps.plan.outputs.superseded != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}

      - name: Build
        id: build
        if: steps.plan.outputs.superseded != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}

      - name: Configure npm auth
        if: inputs.system == 'nx' && inputs.publish-command != '' && steps.plan.outputs.superseded != 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            '@continuous-release:registry=https://npm.pkg.github.com' \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            > "$HOME/.npmrc"

      # Publish is always attempted for a reserved version. Re-runs rely on
      # the publish command being idempotent (npm returns 409 for a version
      # that already exists); that is what closes the publish-then-release
      # window without ever republishing a different build.
      - name: Publish
        if: inputs.publish-command != '' && steps.plan.outputs.superseded != 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: ${{ inputs.publish-command }}

      - name: Create or update release
        if: steps.plan.outputs.superseded != 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          NOTES: ${{ steps.plan.outputs.notes_path }}
          ARTIFACT_GLOB: ${{ inputs.artifact-glob }}
        run: |
          set -euo pipefail

          args=(release --repo "$GITHUB_REPOSITORY" --tag "$TAG" --target "$GITHUB_SHA" --notes-file "$NOTES")

          if [[ -n "${ARTIFACT_GLOB:-}" ]]; then
            shopt -s globstar nullglob
            mapfile -t files < <(compgen -G "$ARTIFACT_GLOB" || true)
            if [[ ${#files[@]} -eq 0 ]]; then
              echo "No artifacts matched: $ARTIFACT_GLOB" >&2
              exit 1
            fi
            for file in "${files[@]}"; do
              args+=(--asset "$file")
            done
          fi

          cr "${args[@]}"

      # A failure before the build completes has no external side effect, so
      # drop the reserved tag and let the next push reuse the version. A
      # publish or release failure keeps the tag so a re-run retries it.
      - name: Drop the reservation
        if: failure() && steps.plan.outcome == 'success' && steps.plan.outputs.superseded != 'true' && steps.build.outcome != 'success'
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: cr unreserve --tag "$TAG" --target "$GITHUB_SHA"
